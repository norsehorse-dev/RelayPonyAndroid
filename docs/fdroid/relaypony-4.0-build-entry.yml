# Draft Builds entry for fdroiddata's metadata/com.relaypony.android.yml, for the first release
# with RelayPonyPake (4.0.0). Fill in the commit once 4.0.0 is tagged. Modeled on PassPony's
# accepted recipe: submodules for RelayPonyPake / AgePonyAndroid / PonyDirect-Kotlin, rustup and
# cargo-ndk in prebuild, the NDK pinned to gradle.properties' ndkVersion. No build: block is
# needed: :pake's buildPake task runs scripts/build-pake.sh during the Gradle build, after the
# scanner, when the generated .so and bindings are absent (they are gitignored).

  - versionName: 4.0.0
    versionCode: 13
    commit: <4.0.0 tag commit>
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y rustup build-essential python3
    gradle:
      - yes
    prebuild:
      - sed -i -e '/foojay/d' ../settings.gradle.kts
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustup default 1.95.0
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - cargo install cargo-ndk@4.1.2 --locked
    ndk: 27.2.12479018
